        /* --- DESIGN SYSTEM & VARIABLES --- */

/* --- TITRE PRINCIPAL (H1) - VERSION STABLE & ÉLÉGANTE --- */
h6 {
    display: block;
    width: fit-content;
    margin: 30px auto;
    padding: 15px 40px;
    position: relative;
    z-index: 1;
    text-align: center;
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    font-size: 3rem;
    font-weight: 800;
    font-style: italic;
    box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
    border-radius: 12px;
    color: #1e40af;
}

h6::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: -1;
    border: 2px solid #C0C0C0;
    border-radius: 12px;
    background: linear-gradient(90deg, #dcdcdc, #ffffff, #dcdcdc, #ffffff, #dcdcdc);
}

@media (max-width: 480px) {
    h6 {
        font-size: 2rem;
        padding: 10px 20px;
    }
}

/* --- TITRE PRINCIPAL (H1) SPÉCIAL --- */
h1 { 
    font-size: 3rem; 
    text-align: center; /* Centré */
    margin: 20px auto;
    padding: 20px;
    background: white; /* Fond blanc pour le cadre */
    border: 3px solid var(--primary); /* Le cadre autour */
    border-radius: var(--radius); /* Bords arrondis */
    color: var(--primary);
    display: table; /* Permet au cadre de s'adapter à la largeur du texte et non toute la page */
    margin-left: auto;
    margin-right: auto;
}

/* --- RESTAURATION DU MENU (Niveaux) --- */
.level-card {
    background: var(--card-bg); 
    padding: 40px 20px;
    text-align: center;
    border-radius: var(--radius);
    box-shadow: var(--shadow); 
    cursor: pointer;
    transition: all 0.3s ease;
    border: 2px solid transparent; /* On garde la bordure pour l'effet hover */
}

/* Effet au survol (on le garde, c'est joli) */
.level-card:hover {
    transform: translateY(-8px);
    border-color: var(--primary);
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
}

/* --- TITRES DE SECTIONS (H2 à H4) --- */
h2 {
    font-size: 2rem;
    color: var(--primary);
    border-bottom: 2px solid var(--primary-light);
    padding-bottom: 5px;
    margin-top: 40px;
    margin-bottom: 20px;
}

h3 {
    font-size: 1rem;
    color: var(--secondary);
    margin-top: 30px;
    margin-bottom: 15px;
    display: flex;
    align-items: center;
}

h5 {
    font-size: 1.4rem;
    color: var(--primary);
    margin-top: 30px;
    margin-bottom: 15px;
    display: flex;
    align-items: center;
}
/* Classe pour créer un retrait (effet tabulation) */

    }

        }

        }

        /* --- CONTENU DES CHAPITRES (COURS/EXERCICES) --- */
        .card {
            background: var(--white);

            font-size: 1.2rem;

        }

        .chapters-grid {
            display: grid;

        }

        .chapter-item:hover { background: #eff6ff; border-color: var(--primary); }

        .chapter-icon {
            width: 35px; height: 35px;

            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;

/* Nouveau style du badge : ultra-discret */

input[type="text"],

}



        .notion-box {

        /* --- NOUVELLE CLASSE : MÉTHODE / EXERCICE TYPE --- */
.method-box {
    background: #ffffff; /* Fond blanc pour bien trancher avec le reste */

    position: relative;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05); /* Légère ombre pour le relief */
}

/* Le petit badge incrusté (le titre de la méthode) */
.method-badge {
    display: inline-block;

    padding: 4px 12px;
    border-radius: 20px; /* Forme pilule très moderne */

    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 10px;
}

/* Pour les méthodes de type "Piège" (pour varier) */

    border-color: var(--secondary); /* Bordure violette */
}

}

/* --- TITRES DE SECTIONS (H2 à H4) --- */

/* Style de base commun pour tous les titres de section */
h2.section-title, 
h3.section-title, 
h4.section-title {
    margin-top: 40px;
    margin-bottom: 15px;
    display: flex; /* Permet d'aligner le numéro auto et le texte proprement */
    align-items: center;
}

/* Style spécifique pour H2 : On garde la bordure qui traverse la page */
h2.section-title {
    font-size: 1.8rem;
    color: var(--primary);
    border-bottom: 2px solid var(--primary-dark); /* La ligne sous le H2 */
    padding-bottom: 5px;
}

/* Style spécifique pour H3 : Plus petit et SANS bordure traversante */
h3.section-title {
    font-size: 1.4rem; /* Taille réduite par rapport au H2 */
    color: var(--primary-medium);
    border-bottom: none; /* On supprime la ligne qui traverse la page */
    padding-bottom: 0;
}

/* Style spécifique pour H4 : Encore plus petit et SANS bordure */
h4.section-title {
    font-size: 1.1rem; /* Taille réduite par rapport au H3 */

    padding-bottom: 0;
}

/* Style pour les numéros automatiques (pour qu'ils ne collent pas au texte) */
.auto-number {
    margin-right: 8px;

}

}

}

/* Conteneur du quiz injecté */
.injected-quiz-container {
    width: 100%;

}

/* Pour que le quiz ne bloque pas le défilement, il est simplement inséré dans le DOM */

/* Conteneur de la fraction visuelle */
.fraction-editor {
    display: inline-flex;
    flex-direction: column;
    vertical-align: middle;
    align-items: center;
    margin: 0 5px;
}

/* La ligne de fraction */
.fraction-line {
    width: 100%;
    height: 2px;
    background-color: var(--text-main);
    margin: 4px 0;
}

/* Les cases pour numérateur et dénominateur */
.fraction-input {

    border-radius: 4px;

}

}

/* Conteneur du clavier mathématique */
/* Pour que le clavier ne soit pas trop encombré */
.math-keyboard {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 5px;
    margin-top: 10px;
}
/* Style des touches du clavier */
.math-key {
    background: white;
    border: 1px solid #cbd5e1;
    padding: 10px 5px;
    border-radius: 8px;
    font-size: 1.1rem;
    font-weight: bold;
    color: var(--primary);
    cursor: pointer;
    text-align: center;
    transition: all 0.25s;
    user-select: none; /* Empêche la sélection de texte lors du tapotement */
    position: relative;
    z-index: 100; /* On l'élève au premier plan */
    pointer-events: auto !important; /* On force la capture du clic */
}

.math-key:active {
    background: var(--primary-light);
    transform: scale(0.95);
}

/* Pour les touches plus larges si besoin (ex: le symbole racine) */
.math-key.wide {
    grid-column: span 2;
}

                                <!-- SECTION : INTRODUCTION -->
                                <section class="course-section">
                                    <h2 class="section-title">Introduction - substituer</h2>
                                    <p>Une expression algébrique (ou expression littérale) est une manière d’écrire un calcul où certains nombres sont représentés par des lettres.</p>
                                    <p><strong class="section-title">Exemples :</strong> Le périmètre du carré = $4 \\times c$ et l’aire du carré = $c \\times c$. Ici la lettre « c » représente la longueur du côté du carré.</p>
                                    <p>Pour calculer la valeur d’une expression littérale, il suffit de remplacer les lettres par leurs valeurs numériques. Si le côté du carré mesure 3cm alors il suffira de remplacer tous les «c» de l’expression par 3. Le périmètre vaudra $4 \\times 3 = 12\\text{cm}$ et l’aire vaudra $3 \\times 3 = 9\\text{ cm}^2$.</p>
                                    <p>On dit que « $4 \\times c$ » est l’<strong>expression littérale</strong> qui calcule le périmètre du carré <strong class="section-title">en fonction de</strong> la <strong class="section-title">variable</strong> $c$.</p>
                                    <p>Faire du calcul littéral permet de résoudre des problèmes compliqués en créant des formules qui donneront les solutions du problème pour toutes les valeurs (<strong class="section-title">variables</strong>) que l’on souhaite.</p>
                                    
                                    <div class="notion-box">
                                        <strong style="color: var(--secondary);">⚠️ Remarques : dans une expression littérale :</strong>
                                        <ul>
                                            <li>Une même lettre représente le même nombre ;</li>
                                            <li>On a le droit de ne pas écrire le symbole $\\times$ entre deux lettres, entre un nombre et une lettre, ou avant une parenthèse ouvrante.</li>
                                        </ul>
                                    </div>
                                    <p>Exemples : $a \\times b = ab$ ; $3 \\times r = 3r$ ; $3 \\times (c+2) = 3(c+2)$;</p>
                                    <p><strong class="section-title">Priorités de calculs :</strong></p>
                                    <ol>
                                        <li>Parenthèses en priorité en commençant par les plus intérieures</li>
                                        <li>Puis les puissances</li>
                                        <li>Puis les multiplications/divisions</li>
                                        <li>Et enfin en dernier les additions/soustractions</li>
                                    </ol>

                                <!-- SECTION : STRUCTURE -->

                                    <h2 class="section-title">Structure d’une expression littérale</h2>
                                    <p><strong>Pour connaître la structure d’une expression littérale</strong>, il faut identifier la dernière opération que l'on serait amené à faire en respectant les règles de priorité de calculs.</p>
                                    <p>Si cette dernière opération est :</p>
                                    <ul>
                                        <li><u>une addition ou une soustraction</u>, alors l'expression est une <u>somme</u>.</li>
                                        <li><u>une multiplication ou une division ou une élévation à la puissance</u>, alors l'expression est <u>un produit</u>.</li>

                                    <p>Rappel : l’opposé de $-10$ est $+10$ car $-10 + 10 = 0$.</p>
                                    <p>Pour connaître l’opposé d’une expression littérale il suffit de mettre toute l’expression entre parenthèses et de la faire précéder d’un signe « $-$ ».</p>

            <!-- SECTION : VOCABULAIRE -->
            <section class="course-section">

                <p><strong class="section-title">Définition :</strong> Une équation est une égalité dans laquelle intervient un nombre inconnu, désigné par une lettre : $x, y, a, b, t \\dots$</p>

                <p><strong>a) Règle 1 :</strong> On peut ajouter (ou soustraire) un même nombre aux deux membres d'une équation. Soient $a, b$ et $c$ trois nombres réels quelconques :</p>
                <blockquote>

                                    <div id="quiz-area-calcul"></div>

                                    <h3 class="section-title">Propriétés</h3>
                                    <ul>
                                        <li>La somme de la probabilité de tous les événements est toujours égale à $1$.</li>
                                        <li>Le pourcentage de chance qu’un événement se produise se calcule en multipliant la probabilité par $100$.</li>
                                        <li>La probabilité d’un événement est la somme des probabilités des issues qui composent l’évènement.</li>
                                        <li>La somme des probabilités d’un événement et de son événement contraire vaut $1$ : $P(A) + P(\\overline{A}) = 1$, ou plus souvent $P(\\overline{A}) = 1 - P(A)$.</li>
                                    </ul>

                                    <div class="notion-box">
                                        <strong style="color: var(--secondary);">💡 Exemples :</strong><br>
                                        $P(\\text{pile}) + P(\\text{face}) = 0,5 + 0,5 = 1$.<br>
                                        J’ai $0,5 \\times 100 = 50\\%$ de chances de tomber sur pile.<br>
                                        Événement B (obtenir 5 ou 6 avec le dé) : $P(B) = P(5) + P(6) = \\frac{1}{6} + \\frac{1}{6} = \\frac{2}{6} = \\frac{1}{3}$.<br>
                                        Pour trouver $P(\\overline{B})$, on peut faire : $P(\\overline{B}) = P(1)+P(2)+P(3)+P(4)$ OU $P(\\overline{B}) = 1 - P(B) = 1 - \\frac{1}{3} = \\frac{2}{3}$.
                                    </div>
                                    <button class0="btn-check-understanding" data-quiz-target="quiz-area-proprietes" onclick="startQuizFromButton('quiz-area-proprietes', 4)">Ai-je bien compris ?</button>
                                    <div id="quiz-area-proprietes"></div>
                                </section>

                                <!-- SECTION : DEUX ÉPREUVES -->
                                <section class="course-section">
                                    <h2 class="section-title">Probabilité d’une expérience aléatoire à deux épreuves</h2>
                                    <p>Lorsqu’on recherche une probabilité qui lie deux expériences on utilise <strong class="section-title">un arbre des possibles</strong>.</p>
                                    <p>Chaque <strong class="section-title">branche</strong> de l’arbre correspond à une <strong class="section-title">issue</strong> possible. (Attention à ne pas confondre avec les expériences ou épreuves).</p>
                                    
                                    <div class="notion-box">
                                        <strong style="color: var(--primary);">💡 Règle de calcul :</strong>
                                        <p>Avec un arbre, la probabilité de l’issue auquel conduit un chemin est égale au <strong class="section-title">produit des probabilités</strong> rencontrées le long de ce chemin.</p>
                                    
                                    <div class="notion-box">
                                        <strong style="color: var(--primary);">📝 Exemple :</strong><br>
                                        Je pioche une boule dans une urne (3 jaunes, 2 rouges), puis je lance un dé coloré (2 faces jaunes, 1 bleue, 3 noires).<br>
                                        Probabilité d'obtenir {une boule jaune ET une face jaune} :<br>
                                        $P(A) = \\frac{3}{5} \\times \\frac{2}{6} = \\frac{3 \\times 2}{5 \\times 6} = \\frac{6}{30} = \\frac{1}{5}$.
                                    </div>
                                    <button class="btn-check-understanding" data-quiz-target="quiz-area-arbre" onclick="startQuizFromButton('quiz-area-arbre', 5)">Ai-je bien compris ?</button>
                                    <div id="quiz-area-arbre"></div>
                                </section>

                                <!-- SECTION : LOI DES GRANDS NOMBRES -->
                                <section class="course-section">

                                    <p>Lorsqu’on répète une expérience aléatoire un grand nombre de fois, la fréquence d’apparition d’un événement se rapproche de la probabilité théorique.</p>
                                    
                                    <div class="notion-box">

                                    </div>

                                    <p><em class="section-title">Exemple :</em> Si je lance un dé truqué 1000 fois, je remarque que je tombe 350 fois sur le nombre 6. La probabilité d’obtenir un 6 se rapproche de $\\frac{350}{1000} = 0,35$ (soit $35\\%$).</p>

                                    <div id="quiz-area-loi-grands-nombres"></div>
                                </section>

                            <div class="course-container">
                                <!-- SECTION : OBJECTIFS -->
                                <section class="course-section">
                                    <p><strong class="section-title">Objectifs :</strong></p>
                                    <ul>
                                        <li>Reconnaître une situation de proportionnalité (tableau, graphique).</li>
                                        <li>Calculer une quatrième proportionnelle.</li>
                                        <li>Modéliser la proportionnalité par une fonction linéaire.</li>

                                <!-- SECTION : RECONNAITRE LA PROPORTIONALITE -->
                                <section class="course-section">
                                    <h2 class="section-title">Reconnaître la proportionnalité</h2>
                                    
                                    <p><strong class="section-title">À partir d'un tableau :</strong></p>
                                    <p>Pour savoir si un tableau est proportionnel, on vérifie si les nombres de la deuxième ligne sont tous multipliés par le même nombre (le coefficient de proportionnalité).</p>
                                    <div class="notion-box">
                                        <p>Exemple : Si pour 2 stylos on paie 5€, pour 4 stylos on doit payer 10€. Le rapport est constant ($5/2 = 2,5$ et $10/4 = 2,5$).</p>
                                    </div>
                                    <button class="btn-check-understanding" data-quiz-target="quiz-area-tableau" onclick="startQuizFromButton('quiz-area-tableau', 1)">Ai-je bien compris ?</button>
                                    <div id="quiz-area-tableau"></div>

                                    <p><strong class="section-title">À partir d'un graphique :</strong></p>
                                    <p>Une situation est proportionnelle si la représentation graphique est une <strong class="section-title">droite qui passe par l'origine du repère</strong>.</p>
                                    <div class="notion-box">
                                        <ul class="mt-2">
                                            <li>Si la droite ne passe pas par l'origine $\\rightarrow$ <strong>Non proportionnel</strong>.</li>
                                            <li>Si ce n'est pas une droite (courbe) $\\rightarrow$ <strong>Non proportionnel</strong>.</li>
                                        </ul>
                                    </div>
                                    <button class="btn-check-understanding" data-quiz-target="quiz-area-graphique" onclick="startQuizFromButton('quiz-area-graphique', 2)">Ai-je bien compris ?</button>

                                <!-- SECTION : QUATRIEME PROPORTIONNELLE -->
                                <section class="course-section">
                                    <h2 class="section-title">Calcul de quatrième proportionnelle</h2>
                                    <p>Dans une situation de proportionnalité, il est possible de résoudre des problèmes de plusieurs façons qui donneront le même résultat.</p>
                                    <p><em class="section-title">Exemple :</em> J'ai acheté 4 stylos pour 5€, combien vais-je payer pour 7 stylos ?</p>

                                    <h3 class="section-title">Méthode 1 : Passage par l'unité</h3>
                                    <div class="notion-box">
                                        <p>On cherche d'abord la valeur pour une seule unité.</p>
                                        <p>Prix de 1 stylo : $4 \\div 5 = 1,25$ €</p>
                                        <p>Prix de 7 stylos : $7 \\times 1,25 = 8,75$ €</p>
                                    </div>
                                    <button class="btn-check-understanding" data-quiz-target="quiz-area-unite" onclick="startQuizFromButton('quiz-area-unite', 3)">Ai-je bien compris ?</button>
                                    <div id="quiz-area-unite"></div>

                                    <h3 class="section-title">Méthode 2 : Le produit en croix</h3>
                                    <p>On utilise un tableau de proportionnalité. Le signe $\\times$ fait penser à la diagonale du tableau.</p>
                                    <table style="width:50%">
                                        <thead>
                                            <tr>
                                                <th>Quantité</th>
                                                <th>Prix (€)</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr><td>2</td><td>2,5</td></tr>
                                            <tr><td>7</td><td>?</td></tr>
                                        </tbody>
                                    </table>
                                    <div class="notion-box">
                                        <p>Le nombre manquant est : $(2,5 \\times 7) \\div 2 = 8,75$ €</p>
                                    </div>
                                    <button class="btn-check-understanding" data-quiz-target="quiz-area-produit-croix" onclick="startQuizFromButton('quiz-area-produit-croix', 4)">Ai-je bien compris ?</button>
                                    <div id="quiz-area-produit-croix"></div>
                                </section>

                                <!-- SECTION : FONCTION LINEAIRE -->
                                <section class="course-section">
                                    <h2 class="section-title">Modéliser par une fonction linéaire</h2>
                                    <p>La représentation graphique d’une situation de proportionnalité est une droite qui passe par l’origine du repère : c'est une <strong class="section-title">fonction linéaire</strong>.</p>
                                    <div class="notion-box">

                                    <button class="btn-check-understanding" data-quiz-target="quiz-area-fonction" onclick="startQuizFromButton('quiz-area-fonction', 5)">Ai-je bien compris ?</button>

                                <section class="course-section">

                                    <p>Un pourcentage est une proportion. Il peut donc être modélisé par une fonction linéaire.</p>

                                                    <h3 class="section-title" style="font-size: 1.2rem;">Définition – Notation :</h3>
                                                    <p>Soit $a$ et $b$ deux nombres fixés.</p>

                                    <!-- SECTION I : VOCABULAIRE -->
                                    <section class="course-section">
                                        <h2 class="section-title">Vocabulaire</h2>
                                        <p><strong style="color: var(--primary);">Adjacent</strong> signifie « à côté de ».</p>
                                        <div class="notion-box">

                                        <div id="quiz-area-vocabulaire"></div>
                                    </section>

                                    <!-- SECTION II : DÉFINITION ET FORMULES -->
                                    <section class="course-section">
                                        <h2 class="section-title">Définition</h2>
                                        <p><em style="font-size: 0.9rem;">(Activité géogébra)</em></p>
                                        <ul>
                                            <li><u style="color: var(--secondary);">Le rapport</u> des longueurs d’un triangle rectangle ne dépend que de la valeur de l’angle.</li>
                                            <li>Nous avons donc pu créer des fonctions (cos ; sin ; tan), sous forme de tableau, reliant la valeur de l’angle et le rapport entre les longueurs.</li>
                                        </ul>

                                        <div class="notion-box" style="border-left-color: #e74c3c;">
                                            <p><strong style="color: #e74c3c;">⚠️ Attention : ces formules ne sont vraies <u style="color: #e74c3c;">que dans un triangle rectangle.</u></strong></p>
                                            <p>$$\\text{Cosinus}(\\text{angle}) = \\frac{\\text{côté Adjacent}}{\\text{Hypoténuse}}$$</p>
                                            <p>$$\\text{Sinus}(\\text{angle}) = \\frac{\\text{côté Opposé}}{\\text{Hypoténuse}}$$</p>
                                            <p>$$\\text{Tangente}(\\text{angle}) = \\frac{\\text{côté Opposé}}{\\text{côté Adjacent}}$$</p>
                                            <p><strong style="text-align: center; display: block; margin-top: 10px;">(Astuce mnémotechnique : CAH SOH TOA)</strong></p>
                                        </div>

                                        <button class="btn-check-understanding" data-quiz-target="quiz-area-formules" onclick="startQuizFromButton('quiz-area-formules', 13)">Ai-je bien compris ?</button>

                                    <!-- SECTION III : CALCULER UNE LONGUEUR -->
                                    <section class="course-section">
                                        <h2 class="section-title">Application : calculer une longueur</h2>

                                        <div class="notion-box">
                                            <p><strong>Exemple : Calculer AB</strong></p>
                                            <p>Le triangle ABC est rectangle en B. Donc :</p>

                                                <p>$$\\cos(60^\\circ) = \\frac{BC}{8}$$</p>

                                                <p>Produit en croix (ou équation) : $$BC = 8 \\times \\cos(60^\\circ) \\div 1 = 4\\text{ cm}$$</p>

                                        <p>Sur la calculatrice on obtient l’angle en utilisant les fonctions réciproques : <strong>Arccos</strong> ; <strong>Arcsin</strong> et <strong>Arctan</strong> qui donnent directement les antécédents (angles) des rapports de longueurs.</p>

                                        <div class="notion-box" style="border-left-color: var(--secondary);">

                                        <p><strong style="color: var(--secondary);">Définition (Translation) :</strong> Quand on fait glisser une figure d’un point A à un point A’ on dit qu’on effectue une <strong style="text-decoration: underline;">translation de A vers A’</strong>.</p>

                                <section class="course-section">
                                    <h2 class="section-title">Homothétie</h2>
                                    <div class="notion-box">
                                        <p><strong style="color: var(--secondary);">Définition :</strong> Une homothétie de rapport $k$ (avec $k$ nombre relatif non nul) permet d’agrandir ou réduire une figure à partir d’un point choisi comme centre.</p>
                                    </div>

                                    <h3 class="section-title">Homothétie de rapport positif</h3>
                                    <p>M’ est l’image de M par l’homothétie de <strong style="text-decoration: underline;">centre O</strong> et de <strong style="text-decoration: underline;">rapport k</strong> $> 0$ signifie que :</p>
                                    <img src="images/chap13_homo_positif.png" alt="Schéma homothétie rapport positif" style="max-width: 100%; margin: 10px 0;">

                                        <li>O, M et M’ sont alignés</li>
                                        <li>M et M’ sont du même côté par rapport à O.</li>
                                        <li>$OM' = k \\times OM$</li>

                                        <ul style="margin-bottom: 0;">
                                            <li>O, M et M’ sont alignés</li>
                                            <li>M et M’ ne sont pas du même côté par rapport à O</li>

                                    <h3 class="section-title">Propriétés de l'homothétie</h3>
                                    <div class="notion-box">
                                        <p>Dans une homothétie de rapport $k$ :</p>
                                        <ul>
                                            <li>Si $-1 < k < 1$, alors l’image de la figure est <strong style="color: var(--primary);">une réduction</strong> de la figure de départ.</li>
                                            <li>Si $k > 1$ ou $k < -1$, l’image de la figure est <strong style="color: var(--primary);">un agrandissement</strong> de la figure de départ.</li>
                                        </ul>
                                    </div>

                                    <div class="notion-box" style="border-left-color: #e74c3c;">
                                        <p><strong style="color: #e74c3c;">⚠️ Attention :</strong> L’homothétie <strong style="text-decoration: underline;">conserve</strong> l’alignement des points et les angles (parallèles, perpendiculaires...), <strong style="text-decoration: underline;">MAIS</strong> elle <strong style="color: #e74c3c;">ne conserve PAS</strong> les longueurs et les aires.</p>
                                        <p>Les longueurs sont multipliées par $|k|$, les aires par $k^2$ et les volumes par $|k|^3$.</p>
                                    </div>

                                    <div class="notion-box">
                                        <p><strong style="color: var(--primary);">Exemple :</strong> Une figure a un périmètre de $5\\text{ cm}$ et une aire de $2,5\\text{ cm}^2$. Elle est transformée par une homothétie de rapport $4$. Quel sera l’aire et le périmètre de son image ?</p>
                                        <p>• Périmètre = $5 \\times 4 = 20\\text{ cm}$ <br>
                                        • Aire = $2,5 \\times 4^2 = 2,5 \\times 16 = 40\\text{ cm}^2$</p>
                                    </div>

                                    <button class="btn-check-understanding" data-quiz-target="quiz-area-homothety" onclick="startQuizFromButton('quiz-area-homothety', 15)">Ai-je bien compris ?</button>

    // 4. LOGIQUE DE DONNÉES (Le lien avec le serveur)
    
async function loadDataFromSupabase() {
    // On ne met pas de message "Chargement" car le cours est déjà affiché
    
    let studentCards = [];
    try {
        const { data: remoteData, error } = await supabaseClient
            .from('chapters')
            .select('*')
            .eq('level', currentLevel);

        if (error) throw error;
        studentCards = remoteData || [];
    } catch (e) {
        console.error("Erreur Supabase:", e);
        return; 
    }

    // 1. On stocke les cartes dans la variable globale pour le mode entraînement
    studentCardsGlobal = studentCards;

    // 2. On met à jour les compteurs de badges sur l'officiel (pour l'affichage visuel)
    const currentLevelData = data.find(item => item.name === currentLevel);
    if (currentLevelData && Array.isArray(currentLevelData.themes)) {
        currentLevelData.themes.forEach(theme => {
            theme.chapters.forEach(officialChap => {
                // On compte combien de cartes élèves correspondent à ce titre
                officialChap.studentCount = studentCards.filter(card => 
                    card.title && card.title.trim().toLowerCase() === officialChap.title.trim().toLowerCase()
                ).length;
            });
        });
    }

    // 3. On rafraîchit l'affichage pour que les badges ✨ apparaissent sur la grille
    renderContent(); 
}




  async function saveNewCard() {
    const selectedId = document.getElementById('new-chap-select').value;
    const type = document.getElementById('new-question-type').value;
    const content = document.getElementById('new-chap-content').value;
    const q = document.getElementById('new-quiz-q').value;

    let a = "";
    let optionsStr = ""; 

    if (type === 'ouverte') {
        a = document.getElementById('new-quiz-a').value.trim();
    } else {
        a = document.getElementById('new-qcm-correct').value.trim();
        optionsStr = document.getElementById('new-qcm-options').value; 
    }

    if (!selectedId || !q || !a) {
        alert("Erreur : Veuillez remplir les champs obligatoires.");
        return;
    }

    // 4. Préparation de l'interface utilisateur (bouton en chargement)
    const btn = document.querySelector('#view-creator .action-btn');
    const originalBtnText = btn.innerText;
    btn.innerText = "Envoi en cours...";
    btn.disabled = true;

    // 5. Recherche du titre et du thème officiel pour la cohérence de la base
    let targetThemeName = "";
    let targetChapterTitle = "";
    const levelsOrder = ["6ème", "5ème", "4ème", "3ème"];
    const levelIndex = levelsOrder.indexOf(currentLevel);
    const levelData = officialData[levelIndex];

    for (let theme of levelData.themes) {
        const chap = theme.chapters.find(c => c.id == selectedId);
        if (chap) {
            targetThemeName = theme.name;
            targetChapterTitle = chap.title;
            break;
        }
    }

    // 6. Construction de l'objet conforme à la table Supabase
    const newRow = {
        level: currentLevel,
        theme_name: targetThemeName,
        title: targetChapterTitle,
        content: content,
        question: q,
        answer: a, // Contient soit le texte simple, soit le code LaTeX \frac{}{}
        type: type,
        options: optionsStr,
        eleve: "oui" 
    };

    // 7. Envoi vers Supabase
    try {
        const { error } = await supabaseClient
            .from('chapters')
            .insert([newRow]);

        if (error) throw error;

        alert("Bravo ! Ta question a été publiée.");
        
        // Réinitialisation du formulaire
        document.getElementById('new-chap-content').value = "";
        document.getElementById('new-quiz-q').value = "";
        document.getElementById('new-quiz-a').value = ""; // Champ texte classique
        document.getElementById('new-qcm-correct').value = "";
        document.getElementById('new-qcm-options').value = "";
        // Réinitialisation de l'éditeur de fraction
        if(document.getElementById('visual-fraction-container')) {
            document.getElementById('visual-fraction-container').style.display = 'none';
            document.getElementById('frac-num').value = "";
            document.getElementById('frac-den').value = "";
        }

        // Rechargement des données et retour à l'application
        await loadDataFromSupabase(); 
        document.getElementById('view-creator').classList.remove('active');
        document.getElementById('view-app').classList.add('active');
        setMode('cours');

    } catch (error) {
        console.error("Erreur Supabase:", error);
        alert("Erreur lors de l'enregistrement : " + error.message);
    } finally {
        // Remise en état du bouton
        btn.innerText = originalBtnText;
        btn.disabled = false;
    }
}

// --- 1. INSERTION ET MISE À JOUR DES APERÇUS ---

function insertMathChar(char, btn) {
    // 1. On essaie d'abord de récupérer l'élément qui a le focus (le comportement normal)
    let activeInput = document.activeElement;

    // 2. SI LE FOCUS EST PERDU (cas où le clic sur le bouton a déplacé le focus)
    if (!activeInput || (activeInput.tagName !== 'INPUT' && activeInput.tagName !== 'TEXTAREA')) {
        
        // On cherche le bloc parent (la carte ou la vue)
        const parentBlock = btn.closest('.card') || btn.closest('.view');
        
        if (parentBlock) {
            const inputsInBlock = Array.from(parentBlock.querySelectorAll('input[type="text"], textarea'));
            
            if (inputsInBlock.length > 0) {
                // --- LA CORRECTION EST ICI ---
                // Au lieu de prendre le dernier, on cherche l'input qui est le plus proche du bouton cliqué
                let closestInput = inputsInBlock[0];
                let minDistance = Infinity;

                inputsInBlock.forEach(input => {
                    // On calcule la distance entre le centre du bouton et le centre de l'input
                    const btnRect = btn.getBoundingClientRect();
                    const inputRect = input.getBoundingClientRect();
                    
                    const btnCenter = {
                        x: btnRect.left + btnRect.width / 2,
                        y: btnRect.top + btnRect.height / 2
                    };
                    const inputCenter = {
                        x: inputRect.left + inputRect.width / 2,
                        y: inputRect.top + inputRect.height / 2
                    };

                    const distance = Math.sqrt(Math.pow(btnCenter.x - inputCenter.x, 2) + Math.pow(btnCenter.y - inputCenter.y, 2));

                    if (distance < minDistance) {
                        minDistance = distance;
                        closestInput = input;
                    }
                });
                activeInput = closestInput;
            }
        }
    }

    // 3. Vérification finale de validité
    if (!activeInput || typeof activeInput.setSelectionRange !== 'function') {
        console.error("Erreur : Aucun champ de saisie valide trouvé.");
        return;
    }

    const start = activeInput.selectionStart;
    const end = activeInput.selectionEnd;
    const value = activeInput.value;
    const id = activeInput.id;

    // 4. DÉTERMINATION DU PROFIL (Identique)
    const isCreationQuestion = id.includes('new-quiz-q') || id.includes('new-chap-content');
    const isCreationAnswer  = id.includes('new-quiz-a') || id.includes('new-qcm-correct');
    const isStudentAnswer   = id.includes('local-user-answer') || id.includes('mini-quiz-answer');

    let insertion = char;

    // 5. LOGIQUE DE CONVERSION (Identique)
    if (isCreationQuestion) {
        if (char === '√') insertion = '$\\sqrt{ }$';
        else if (char === '^') insertion = '$^{ }$';
        else if (char === '/') insertion = '$\\frac{ }{ }$';
        else if (char === '×') insertion = '$\\times$';
    } 
    else if (isCreationAnswer || isStudentAnswer) {
        if (char === '\\sqrt{}' || char === '√') insertion = '√';
        else if (char === '^{}' || char === '^') insertion = '^';
        else if (char === '\\frac{}{}' || char === '/') insertion = '/';
        else if (char === '\\times') insertion = '×';
    }

    // 6. INSERTION ET GESTION DU CURSEUR
    activeInput.value = value.substring(0, start) + insertion + value.substring(end);

    let newPos = start + insertion.length;
    if (isCreationQuestion && insertion.includes('{}')) {
        newPos = start + insertion.indexOf('{}') + 1;
    }

    activeInput.setSelectionRange(newPos, newPos);
    activeInput.focus();
    // 7. MISE À JOUR DE L'APERÇU
    updateSpecificPreview(id);
}






   function updateSpecificPreview(inputId) {
    let previewId = "";
    
    // 1. Identification du conteneur de prévisualisation correspondant à l'input
    if (inputId === 'new-quiz-q') {
        previewId = "preview-q";
    } else if (inputId === 'new-quiz-a') {
        previewId = "preview-a";
    } else if (inputId === 'new-chap-content') {
        previewId = "preview-content";
    }

    const previewElement = document.getElementById(previewId);
    const inputElement = document.getElementById(inputId);

    // Sécurité : si l'input ou le preview n'existe pas, on arrête
    if (!previewElement || !inputElement) return;

    const content = inputElement.value;

    // 2. LOGIQUE D'AFFICHAGE DIFFÉRENCIÉE
    if (inputId === 'new-quiz-a') {
        // MODE RÉPONSE : On affiche le texte brut (ex: 1/2 ou √2)
        // On ne passe PAS par MathJax pour éviter de transformer la saisie 
        // et pour que l'élève voie exactement ce qu'il écrit.
        previewElement.innerHTML = content;
    } else {
        // MODE QUESTION & COURS : On affiche le rendu LaTeX magnifique
        // On utilise innerHTML car le contenu contient des symboles mathématiques
        previewElement.innerHTML = content;

        // On demande à MathJax de traiter le nouveau contenu LaTeX
        if (window.MathJax && window.MathJax.typesetPromise) {
            window.MathJax.typesetPromise([previewElement]).catch((err) => {
                console.error("Erreur MathJax lors de l'aperçu :", err);
            });
        }
    }
}


// --- 2. ÉCOUTEURS D'ÉVÉNEMENTS POUR LA MISE À JOUR EN TEMPS RÉEL ---
// Cette partie permet de mettre à jour l'aperçu dès que l'élève tape au clavier (sans le clavier virtuel)
document.addEventListener('input', (e) => {
    if (e.target.id === 'new-quiz-q') {

        updateSpecificPreview('new-chap-content');
    }
});

function compareAnswers(userAnsRaw, targetAnsRaw) {
    if (!userAnsRaw || !targetAnsRaw) return false;

    const cleanMath = (str) => {
        return str.toString()
            // 1. On transforme les fractions LaTeX \frac{a}{b} en a/b
            .replace(/\\frac\{([^}]*)\}\{([^}]*)\}/g, '$1/$2')
            // 2. On transforme les racines LaTeX \sqrt{x} en √x
            .replace(/\\sqrt\{([^}]*)\}/g, '√$1')
            // 3. On remplace la virgule par un point pour les décimaux
            .replace(/,/g, '.')
            // 4. On nettoie tout ce qui n'est pas un chiffre, un signe, un point, un slash ou un symbole de comparaison
            // On garde : 0-9, . , / , - , + , < , > , √ , ^
            .replace(/[^0-9./\-+<>√^]/g, '')
            .trim();
    };

    let cleanUser = cleanMath(userAnsRaw);
    let cleanTarget = cleanMath(targetAnsRaw);

    // Cas particulier : Si l'élève a écrit √16 et que la réponse est 4
    // On essaie de résoudre les racines simples pour la comparaison
    const solveSimpleRoots = (str) => {
        if (str.includes('√')) {
            // On extrait le nombre après le √
            let num = str.replace('√', '');
            let val = Math.sqrt(parseFloat(num));
            return isNaN(val) ? str : val.toString();
        }
        return str;
    };

    // On applique la résolution des racines pour les deux côtés
    cleanUser = solveSimpleRoots(cleanUser);
    cleanTarget = solveSimpleRoots(cleanTarget);

    console.log("Comparaison :", cleanUser, "vs", cleanTarget);
    
    // Comparaison finale (on convertit en nombre si possible pour éviter 0.5 vs .5)
    if (!isNaN(parseFloat(cleanUser)) && !isNaN(parseFloat(cleanTarget))) {
        return parseFloat(cleanUser) === parseFloat(cleanTarget);
    }

    return cleanUser === cleanTarget;
}



function checkLocalAnswer(correctAnswer, containerId) {
    const input = document.getElementById('local-user-answer');
    if (!input) return;

    // On incrémente le total de questions tentées
    trainingSession.totalAnswered++;

    if (compareAnswers(input.value, correctAnswer)) {
        trainingSession.score++;
        // Succès : on passe à la suite en mode normal
        nextLocalQuestion(containerId);
    } else {
        // Échec : on active le mode aide pour cette question précise
        trainingSession.isReviewMode = true;
        renderInjectedQuiz(document.getElementById(containerId), trainingSession.currentCards, containerId);
    }
}






function nextLocalQuestion(containerId) {

}

                    <p>Aucune question d'élève n'a été trouvée pour le chapitre : <br><strong>"${chapter.title}"</strong></p>
                    <p style="font-size:0.8rem; color:gray; margin-top:10px;">(Vérifiez que le titre dans Supabase est identique)</p>
                    <button class="action-btn" onclick="renderContent()" style="margin-top:20px;">Retour aux chapitres</button>
                </div>`;
            return;
        }

        // Initialisation de la session
        trainingSession.score = 0;
        trainingSession.totalAnswered = 0;
        trainingSession.isReviewMode = false;
        trainingSession.currentCards = [...trainingCards].sort(() => Math.random() - 0.5);
        trainingSession.currentIndex = 0;

        displayTrainingQuestion(chapter.title);
    }
}








    
 function displayTrainingQuestion(chapterTitle) {
    const container = document.getElementById('content-area');
    const currentCard = trainingSession.currentCards[trainingSession.currentIndex];

    if (!currentCard) {
        showFinalScore();
        return;
    }

    // On vérifie si la question vient d'un élève (on peut utiliser une propriété ou simplement 
    // savoir qu'en mode entraînement, toutes les cartes sont des cartes élèves)
    const sparkle = "✨ "; 

    container.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <span style="font-weight:bold; color:var(--primary);">Score: ${trainingSession.score}/${trainingSession.totalAnswered}</span>
            <span style="font-size:0.8rem; color:var(--text-muted);">Question ${trainingSession.currentIndex + 1}/${trainingSession.currentCards.length}</span>
        </div>
        <div class="card">
            <h2 style="margin-bottom:15px;">Entraînement</h2>
            <p style="margin-bottom:15px; color:var(--text-muted);">${chapterTitle}</p>
            <hr style="margin-bottom:20px; opacity:0.2">
            <!-- On ajoute le sparkle ici -->
            <p style="font-size:1.2rem; margin-bottom:20px;">${sparkle}${currentCard.quiz.q}</p>
            <div id="quiz-interaction-zone"></div>
        </div>`;

    const zone = document.getElementById('quiz-interaction-zone');



        if (trainingSession.isReviewMode) {
    // MODE AIDE : On affiche la réponse avec le nouveau style rouge pâle
    zone.innerHTML = `
        <div class="feedback help-mode" style="display:block; margin-bottom:15px;">
            La réponse était : <strong>${currentCard.quiz.a}</strong>
        </div>
        <div class="notion-box">
            <strong>📖 Aide :</strong><br>
            ${currentCard.content || "Consultez votre cours pour plus de détails."}
        </div>
        <button class="action-btn" onclick="nextQuestion('${chapterTitle}')">Question suivante ➔</button>
        `;
        } else {

        // MODE QUESTION : On affiche les inputs ou le QCM
        if (currentCard.type === 'qcm' && currentCard.options && currentCard.options.length > 0) {
            let qcmHTML = `<div style="display:grid; gap:10px; margin-bottom:20px;">`;
            currentCard.options.forEach(opt => {
                qcmHTML += `<button class="action-btn" style="background:white; color:var(--primary); border:2px solid var(--primary);" onclick="checkFullQuiz('${currentCard.quiz.a}', '${chapterTitle}', '${opt}')">${opt}</button>`;
            });
            qcmHTML += `</div>`;
            zone.innerHTML = qcmHTML;
         } else {
            zone.innerHTML = `
                <input type="text" id="user-answer" placeholder="Votre réponse...">
                <button class="action-btn" onclick="checkFullQuiz('${currentCard.quiz.a}', '${chapterTitle}')">Valider</button>
                <div id="feedback" class="feedback"></div>
            `;
            }
        }
        if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([container]).catch((err) => console.log(err));
        }
    }

function showFinalScore() {    // Affiche le score final proprement
    const container = document.getElementById('content-area');
    container.innerHTML = `
        <div class="card" style="text-align:center; padding: 3rem 2rem;">
            <div style="font-size: 4rem; margin-bottom: 10px;">🎉</div>
            <h2 style="font-size: 2.2rem; color: var(--primary); margin-bottom: 10px;">Session terminée !</h2>
            
            <p style="font-size: 1.2rem; color: var(--text-muted); margin-bottom: 30px;">
                Ton résultat final :
            </p>
            
            <div style="background: var(--bg); padding: 20px; border-radius: var(--radius); margin-bottom: 40px; display: inline-block; min-width: 200px;">
                <span style="font-size: 3rem; font-weight: 800; color: var(--secondary);">
                    ${trainingSession.score} <span style="font-size: 1.5rem; color: var(--text-muted);">/</span> ${trainingSession.totalAnswered}
                </span>
            </div>

            <div style="display: block;">
                <button class="action-btn" onclick="resetApp()" style="max-width: 250px; margin: 0 auto;">
                    Retour au menu principal
                </button>
            </div>
        </div>
    `;
}


  // 6. LOGIQUE DES CHAPITRES ET QUIZ (Launch, Check, ShowCourse)

    function checkMiniQuiz(correctAnswer) {
        const input = document.getElementById('mini-quiz-answer');
        const feedback = document.getElementById('mini-quiz-feedback');
        
        if (!input || !feedback) return;

        // Utilisation de votre fonction de comparaison robuste qui gère le LaTeX et les décimaux
        if (compareAnswers(input.value, correctAnswer)) {
            feedback.innerText = "Bravo ! ✅";
            feedback.className = "feedback success";
        } else {
            feedback.innerText = "Réessaie encore ! ❌";
            feedback.className = "feedback error";
        }
    }


    function checkFullQuiz(correctAnswer, chapterTitle, userAnsInput = null) {
        let userAns;

        // SI c'est un QCM (on a cliqué sur un bouton), l'argument userAnsInput contient la valeur du bouton
        if (userAnsInput !== null) {
            userAns = userAnsInput;
        } else {
            // SINON, on cherche l'input texte dans le DOM
            const inputEl = document.getElementById('user-answer');
            userAns = inputEl ? inputEl.value : "";
        }

        trainingSession.totalAnswered++;

        // Utilisation de la comparaison universelle
        if (compareAnswers(userAns, correctAnswer)) {
            trainingSession.score++;
            nextQuestion(chapterTitle);
        } else {
            // En cas d'erreur, on active le mode aide
            trainingSession.isReviewMode = true;
            displayTrainingQuestion(chapterTitle);
        }
    }




    function nextQuestion(chapterTitle) {      // Passe à la question suivante ou finit la session
        trainingSession.currentIndex++;
        trainingSession.isReviewMode = false; // Reset le mode aide pour la prochaine question
        displayTrainingQuestion(chapterTitle);
    }



    function showCourse(chapterTitle) {
        setMode('cours');
        const levelData = data.find(item => item.name === currentLevel);
        const chapter = levelData.themes.flatMap(g => g.chapters).find(c => c.title === chapterTitle);
            
        if (chapter) {
            launchChapter(chapter);
        }
    }

    function applyAutomaticNumbering(container) {
    // On définit les compteurs pour chaque niveau
    let counters = {
        h2: 0,
        h3: 0,
        h4: 0
    };

    /**
     * Fonction récursive qui parcourt tous les éléments du conteneur
     * @param {HTMLElement} element - L'élément actuel à analyser
     */
    function traverse(element) {
        // On vérifie si l'élément est un titre que nous voulons numéroter
        const tagName = element.tagName.toLowerCase();

        if (tagName === 'h2' || tagName === 'h3' || tagName === 'h4') {
            
            if (tagName === 'h2') {
                counters.h2++;      // Incrémente H2
                counters.h3 = 0;    // Réinitialise H3
                counters.h4 = 0;    // Réinitialise H4
                
                const span = document.createElement('span');
                span.className = 'auto-number';
                span.innerText = counters.h2 + ". ";
                element.prepend(span);

            } else if (tagName === 'h3') {
                counters.h3++;      // Incrémente H3
                counters.h4 = 0;    // Réinitialise H4
                
                const span = document.createElement('span');
                span.className = 'auto-number';
                span.innerText = counters.h2 + "." + counters.h3 + ". ";
                element.prepend(span);

            } else if (tagName === 'h4') {
                counters.h4++;      // Incrémente H4
                
                const span = document.createElement('span');
                span.className = 'auto-number';
                span.innerText = counters.h2 + "." + counters.h3 + "." + counters.h4 + ". ";
                element.prepend(span);
            }
        }

        // On parcourt ensuite tous les enfants de l'élément (récursion)
        // Cela permet de trouver des titres même s'ils sont dans une <div> ou <section>
        for (let i = 0; i < element.children.length; i++) {
            traverse(element.children[i]);
        }
    }

    // On lance la traversée à partir du conteneur principal de la carte
    traverse(container);
}
